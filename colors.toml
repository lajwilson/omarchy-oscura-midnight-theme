# Oscura Midnight — Void
# The super-dark cut of the Oscura Midnight palette. True-black surfaces
# (OKLCH hue 265 tint reduced to a whisper) with the signature purple kept
# as the only saturated hue family. The Oscura gold/cream/amber tones are
# gone: warning, number, and "modified" roles now use a muted slate.
# The ANSI axis stays in the theme's cool families but each slot is spaced
# for terminals: green and cyan are two clearly separate teal tones, blue
# and magenta two separate purple tones (dirs vs archives in ls), and every
# bright is a lighter tint of its regular, readable on pure black.
# Source: grok-build crates/codegen/xai-grok-pager-render/src/theme/oscura.rs


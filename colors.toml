# Oscura Midnight — Void
# The super-dark cut of the Oscura Midnight palette. True-black surfaces
# (OKLCH hue 265 tint reduced to a whisper) with the signature purple kept
# as the only saturated hue family. The Oscura gold/cream/amber tones are
# gone: warning, number, and "modified" roles now use a muted slate so the
# whole scheme reads as one cool gradient of black -> purple -> lavender.
# Source: grok-build crates/codegen/xai-grok-pager-render/src/theme/oscura.rs

